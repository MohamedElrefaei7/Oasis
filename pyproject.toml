[project]
name = "oasis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MohamedElrefaei7", email = "melrefae@bu.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "dateparser>=1.4.0",
    "fastapi>=0.139.0",
    "instructor>=1.15.1",
    "lancedb>=0.30.2",
    "langdetect>=1.0.9",
    # Imported directly by llm/ollama.py (an OpenAI client pointed at Ollama's
    # /v1 endpoint), so it is a first-order dependency, not instructor's
    # business. It resolved transitively until 2026-08-02, which works right
    # up until instructor changes its own client stack and a bare `import
    # openai` starts failing in a frozen bundle nobody can pip-install into.
    "openai>=2.48.0",
    "openpyxl>=3.1.5",
    "pathspec>=1.1.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "rich>=14.3.4",
    "sentence-transformers>=5.5.0",
    "tiktoken>=0.13.0",
    "typer>=0.25.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
oasis = "oasis:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
eval = [
    "matplotlib>=3.11.0",
    "pyyaml>=6.0.3",
    "ranx>=0.3.21",
]

[tool.pytest.ini_options]
# Slow tests are deselected by DEFAULT, which is what keeps the standing
# hermeticity property true: a plain `pytest` run never imports torch. Run them
# with `pytest -m slow` (or `pytest -m ''` for everything).
addopts = "-m 'not slow'"
markers = [
    "slow: loads real models (PyTorch); deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented pattern is function calls in argument defaults
# (typer.Option(...)/typer.Argument(...)); B008 flags exactly that, so it's a
# false positive wherever the CLI is defined.
"src/oasis/cli/app.py" = ["B008"]
# Test-local aliases for patched classes are conventionally capitalized
# (MockST, MockCE) to read as the class they stand in for; N806 in tests is
# noise, not a naming problem worth renaming 12 call sites for.
"tests/**" = ["N806"]
