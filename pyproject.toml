[project]
name = "oasis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MohamedElrefaei7", email = "melrefae@bu.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "dateparser>=1.4.0",
    "instructor>=1.15.1",
    "lancedb>=0.30.2",
    "langdetect>=1.0.9",
    "openpyxl>=3.1.5",
    "pathspec>=1.1.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "rich>=14.3.4",
    "sentence-transformers>=5.5.0",
    "tiktoken>=0.13.0",
    "typer>=0.25.1",
    "watchdog>=6.0.0",
]

[project.scripts]
oasis = "oasis:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
eval = [
    "matplotlib>=3.11.0",
    "pyyaml>=6.0.3",
    "ranx>=0.3.21",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
