# Oasis eval query set — 83 labeled queries against oasis-eval-corpus (301 files)
#
# Relevance is GRADED: 3 = the document the query is about; 2 = clearly relevant
# alternative; 1 = marginally relevant (same topic, weaker match, or title-only match).
# Grade >= 1 is "relevant" for binary metrics (precision@k, MRR); use grades for NDCG.
# Documents not listed are grade 0. An empty `relevant: []` means the correct
# behavior is returning nothing confident (scorer: count any top-3 hit as a false positive,
# or skip these ids for averaged metrics and report them separately).
#
# DATE SEMANTICS: all date labels are based on file MTIME (what Oasis filters on),
# not dates that appear in filenames or content. The corpus spreads mtimes
# deterministically over 2019-01..2026-06 by hash of filename. Relative-date queries
# ("last year", "recent") assume the eval runs with today ~= mid-2026; re-label if not.
# Note the deliberate trap: meeting-notes-product-sync-YYYY-MM.docx filename dates do
# NOT match their mtimes.
#
# FOLDER SEMANTICS: folders are the format directories (pdfs/, docx/, ...), so folder
# filters overlap with type filters in this corpus. Still worth testing separately:
# the parser must route "in the txt folder" to `folders`, not `file_types`.

